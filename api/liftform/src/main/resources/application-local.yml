spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/mydb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
  jpa:
    show-sql: true
  rabbitmq:
    addresses: ${RABBITMQ_URL:amqp://guest:guest@rabbitmq}
security:
  jwt:
    secret: ${JWT_SECRET:mysecretkey}
aws:
  endpoint: ${AWS_ENDPOINT_URL:http://minio:9000}
  presigned-endpoint: ${AWS_PRESIGNED_ENDPOINT_URL:http://localhost:9000}
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID:minioadmin}
    secret-key: ${AWS_SECRET_ACCESS_KEY:minioadmin}
app:
  cookie:
    secure: false