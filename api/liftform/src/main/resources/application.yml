spring:
  application:
    name: liftform
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    addresses: ${RABBITMQ_URL}
app:
  cookie:
    secure: false
security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-seconds: 86400
aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket: ${AWS_S3_BUCKET:liftform-bucket}